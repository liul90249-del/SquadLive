services:
  - type: web
    name: squadlive-backend
    runtime: node
    repo: https://github.com/liul90249-del/SquadLive.git
    branch: main
    autoDeployTrigger: commit
    rootDir: Backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.liuzhigang.AI-Live-Streaming
      - key: APPLE_APP_ID
        sync: false
      - key: REWARD_TIME_ZONE
        value: Asia/Shanghai
      - key: APPLE_IAP_ONLINE_CHECKS
        value: "false"
      - key: AI_MAX_CONCURRENCY
        value: "40"
      - key: AI_QUEUE_LIMIT
        value: "300"
      - key: INSTANCE_MEMORY_MB
        value: "512"
    disk:
      name: squadlive-data
      mountPath: /var/data
      sizeGB: 1
