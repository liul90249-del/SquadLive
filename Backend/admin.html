<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/landing/squadlive-logo.png">
  <title>SquadLive 管理后台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --side: #10131b;
      --panel: #151922;
      --panel2: #1c2230;
      --line: #2a3141;
      --text: #f6f7fb;
      --muted: #9ca5b6;
      --brand: #9d84ff;
      --brand2: #ff7f62;
      --gold: #ffd338;
      --green: #53d184;
      --red: #ff6161;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 236px 1fr;
    }
    aside {
      background: var(--side);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      margin-bottom: 18px;
      font-size: 19px;
      font-weight: 900;
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 5px 18px rgba(157,132,255,.22);
    }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .nav {
      display: grid;
      gap: 6px;
    }
    .nav button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }
    .nav button.active {
      background: rgba(157, 132, 255, 0.16);
      color: white;
    }
    .nav i {
      width: 20px;
      text-align: center;
      font-style: normal;
    }
    main {
      min-width: 0;
      padding: 22px;
    }
    .topbar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    input, button, select {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0f1219;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }
    .primary {
      border: 0;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: white;
      font-weight: 900;
      cursor: pointer;
    }
    .ghost {
      background: var(--panel);
      cursor: pointer;
    }
    .token-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .token-box input { width: 260px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .card {
      padding: 16px;
      position: relative;
    }
    .card .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .card .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 950;
    }
    .metric-help {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 50%;
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
      cursor: help;
      outline: none;
    }
    .metric-help::after {
      content: attr(data-tooltip);
      position: absolute;
      z-index: 20;
      top: 28px;
      right: 0;
      width: 250px;
      padding: 10px 12px;
      border: 1px solid rgba(157,132,255,.45);
      border-radius: 9px;
      background: #0d1018;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.55;
      text-align: left;
      white-space: normal;
      box-shadow: 0 12px 30px rgba(0,0,0,.42);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-3px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
    }
    .metric-help:hover::after,
    .metric-help:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .alerts {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .alert strong { display: block; margin-bottom: 5px; }
    .alert.healthy { border-color: rgba(83,209,132,.42); background: rgba(83,209,132,.09); }
    .alert.warning { border-color: rgba(255,211,56,.48); background: rgba(255,211,56,.09); }
    .alert.critical { border-color: rgba(255,97,97,.52); background: rgba(255,97,97,.10); }
    .alert span { color: var(--muted); font-size: 13px; }
    .metric-note { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .panel {
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-head {
      min-height: 56px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 16px;
    }
    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      background: rgba(255,255,255,0.015);
    }
    tbody tr { cursor: default; }
    tbody tr:hover td { background: rgba(255,255,255,0.025); }
    code {
      display: inline-block;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0d1017;
      color: #dce3ff;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #252b38;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .pill.vip { background: rgba(255,211,56,.16); color: var(--gold); }
    .pill.active { background: rgba(83,209,132,.16); color: var(--green); }
    .positive { color: var(--green); font-weight: 800; }
    .negative { color: var(--red); font-weight: 800; }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 14px;
    }
    .profile {
      background: #10141d;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }
    .profile h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .kv {
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }
    .kv strong { color: var(--text); }
    .operation-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 9px;
    }
    .operation-box label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .operation-box input { width: 100%; }
    .operation-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .danger { border: 0; background: rgba(255,97,97,.18); color: #ff9b9b; font-weight: 900; cursor: pointer; }
    .operation-message { min-height: 18px; color: var(--muted); font-size: 12px; }
    .conversation-list {
      display: grid;
      gap: 10px;
      padding: 14px;
      max-height: 560px;
      overflow-y: auto;
    }
    .conversation {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #10141d;
    }
    .conversation-meta {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .conversation-message {
      margin-top: 7px;
      padding: 9px 10px;
      border-radius: 8px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .conversation-message.user { background: rgba(255,255,255,.05); }
    .conversation-message.ai { background: rgba(142,107,255,.13); }
    .section { display: none; }
    .section.active { display: block; }
    a { color: #c3b8ff; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      .cards, .detail-grid { grid-template-columns: 1fr; }
      .topbar, .panel-head { align-items: stretch; flex-direction: column; }
      .token-box, .tools { width: 100%; }
      .token-box input, .tools input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><img src="/assets/landing/squadlive-logo.png" alt="SquadLive logo">SquadLive</div>
      <div class="nav">
        <button class="active" data-section="overview"><i>📊</i>数据概览</button>
        <button data-section="users"><i>👤</i>用户管理</button>
        <button data-section="recharges"><i>🪙</i>充值记录</button>
        <button data-section="vip"><i>💎</i>VIP 订阅</button>
        <button data-section="rewards"><i>🎁</i>分享审核</button>
        <button data-section="settings"><i>⚙️</i>系统设置</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h1 id="pageTitle">数据概览</h1>
          <div class="sub" id="pageSub">实时查看产品核心运营数据</div>
        </div>
        <div class="token-box">
          <input id="tokenInput" placeholder="后台 ADMIN_TOKEN">
          <button class="primary" id="saveToken">保存</button>
          <button class="ghost" id="refresh">刷新</button>
        </div>
      </div>

      <section class="section active" id="section-overview">
        <div class="alerts" id="systemAlerts"></div>
        <div class="cards" id="overviewCards"></div>
        <div class="cards" id="systemCards"></div>
        <div class="panel">
          <div class="panel-head"><h2>最近 30 天使用情况</h2><span class="pill active">每日更新</span></div>
          <div id="dailyUsageTable"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>最近用户</h2></div>
          <div id="recentUsers"></div>
        </div>
      </section>

      <section class="section" id="section-users">
        <div class="panel">
          <div class="panel-head">
            <h2>用户列表</h2>
            <div class="tools">
              <input id="userQuery" placeholder="输入用户 ID 或设备 ID 查询">
              <button class="primary" id="searchUsers">查询</button>
            </div>
          </div>
          <div id="usersTable"></div>
        </div>

        <div class="panel" id="userDetailPanel" style="display:none">
          <div class="panel-head">
            <h2>用户详情</h2>
            <span class="sub" id="selectedUserLabel"></span>
          </div>
          <div id="userDetail"></div>
        </div>
      </section>

      <section class="section" id="section-recharges">
        <div class="panel">
          <div class="panel-head"><h2>全产品充值记录</h2></div>
          <div id="rechargesTable"></div>
        </div>
      </section>

      <section class="section" id="section-vip">
        <div class="panel">
          <div class="panel-head"><h2>VIP 订阅记录</h2></div>
          <div id="vipTable"></div>
        </div>
      </section>

      <section class="section" id="section-rewards">
        <div class="panel">
          <div class="panel-head"><h2>分享奖励审核记录</h2></div>
          <div id="rewardTable"></div>
        </div>
      </section>

      <section class="section" id="section-settings">
        <div class="panel">
          <div class="panel-head"><h2>系统设置</h2></div>
          <div class="detail-grid">
            <div class="profile">
              <h3>新用户初始金币</h3>
              <div class="kv">
                <div>只影响修改后首次创建的用户，不会改变已有用户余额。</div>
              </div>
              <div class="operation-box">
                <label for="initialCoinsInput">初始金币数量</label>
                <input id="initialCoinsInput" type="number" min="0" max="1000000" step="1" placeholder="例如 300">
                <button class="primary" id="saveInitialCoins">保存初始金币</button>
                <div class="operation-message" id="initialCoinsMessage"></div>
              </div>
            </div>
            <div class="profile">
              <h3>部署配置</h3>
              <div class="kv">
                <div>后台地址：<strong>/admin</strong></div>
                <div>API 前缀：<strong>/v1</strong></div>
                <div>认证方式：<strong>ADMIN_TOKEN</strong></div>
              </div>
            </div>
            <div class="profile">
              <h3>运营说明</h3>
              <div class="kv">
                <div>用户反馈邮件会携带<strong>用户查询 ID</strong>。</div>
                <div>在用户管理搜索该 ID，即可打开用户详情。</div>
                <div>人工金币调整会写入金币流水，App 下次启动或回到前台时自动同步。</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      token: localStorage.getItem("squadlive.adminToken") || "",
      users: []
    };

    const titles = {
      overview: ["数据概览", "实时查看产品核心运营数据"],
      users: ["用户管理", "查看用户信息、金币、设备 ID、充值记录和 VIP 状态"],
      recharges: ["充值记录", "查看整个产品的金币充值流水"],
      vip: ["VIP 订阅", "查看会员订阅记录和状态"],
      rewards: ["分享审核", "查看用户提交的分享链接和奖励记录"],
      settings: ["系统设置", "部署配置和上线前检查项"]
    };

    const tokenInput = document.getElementById("tokenInput");
    tokenInput.value = state.token;

    document.querySelectorAll(".nav button").forEach((button) => {
      button.onclick = () => switchSection(button.dataset.section);
    });
    document.getElementById("saveToken").onclick = () => {
      state.token = tokenInput.value.trim();
      localStorage.setItem("squadlive.adminToken", state.token);
      loadAll();
    };
    document.getElementById("refresh").onclick = () => loadAll();
    document.getElementById("searchUsers").onclick = () => loadUsers(true);
    document.getElementById("userQuery").addEventListener("keydown", (event) => {
      if (event.key === "Enter") loadUsers(true);
    });

    function switchSection(section) {
      document.querySelectorAll(".nav button").forEach((item) => item.classList.toggle("active", item.dataset.section === section));
      document.querySelectorAll(".section").forEach((item) => item.classList.toggle("active", item.id === `section-${section}`));
      document.getElementById("pageTitle").textContent = titles[section][0];
      document.getElementById("pageSub").textContent = titles[section][1];
    }

    function money(cents, currency) {
      const amount = Number(cents || 0) / 100;
      const normalizedCurrency = String(currency || "").toUpperCase();
      if (!normalizedCurrency || normalizedCurrency === "UNKNOWN") {
        return `${amount.toFixed(2)}（币种未知）`;
      }
      try {
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency: normalizedCurrency
        }).format(amount);
      } catch (_) {
        return `${normalizedCurrency} ${amount.toFixed(2)}`;
      }
    }

    function bytes(value) {
      const number = Number(value || 0);
      if (number >= 1024 ** 3) return `${(number / 1024 ** 3).toFixed(2)} GB`;
      if (number >= 1024 ** 2) return `${(number / 1024 ** 2).toFixed(1)} MB`;
      if (number >= 1024) return `${(number / 1024).toFixed(1)} KB`;
      return `${number} B`;
    }

    function duration(seconds) {
      const total = Number(seconds || 0);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      return days ? `${days}天 ${hours}小时` : `${hours}小时 ${minutes}分钟`;
    }

    function time(value) {
      if (!value) return "-";
      return new Date(value).toLocaleString("zh-CN", { hour12: false });
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      })[character]);
    }

    async function api(path) {
      const response = await fetch(path, {
        headers: { authorization: `Bearer ${state.token}` }
      });
      if (!response.ok) {
        let message = response.statusText;
        try { message = (await response.json()).error || message; } catch {}
        throw new Error(message);
      }
      return response.json();
    }

    async function apiPost(path, body) {
      const response = await fetch(path, {
        method: "POST",
        headers: {
          authorization: `Bearer ${state.token}`,
          "content-type": "application/json"
        },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        let message = response.statusText;
        try { message = (await response.json()).error || message; } catch {}
        throw new Error(message);
      }
      return response.json();
    }

    function table(headers, rows, empty = "暂无数据") {
      if (!rows.length) return `<div class="empty">${empty}</div>`;
      return `<table><thead><tr>${headers.map((item) => `<th>${item}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
    }

    function metricCard(label, value, tooltip) {
      return `<div class="card">
        <span class="metric-help" tabindex="0" aria-label="${escapeHTML(label)} 指标说明" data-tooltip="${escapeHTML(tooltip)}">?</span>
        <div class="label">${escapeHTML(label)}</div>
        <div class="value">${value}</div>
      </div>`;
    }

    function renderOverview(overview) {
      const items = [
        ["总用户数", overview.totalUsers, "当前后端用户表中的用户总数。相同设备 ID 会复用已有用户，不会重复计数。"],
        ["5 分钟活跃", overview.activeUsers5m, "最近 5 分钟内有 lastSeenAt 活动记录的用户数量。"],
        ["今日新增", overview.newUsersToday, "按服务器时区当天 00:00 至当前时间创建的用户数量。"],
        ["PRO 用户", `${overview.premiumUsers} · ${overview.premiumConversionPercent}%`, "PRO 用户数，以及 PRO 用户数 ÷ 总用户数 × 100%，结果保留 1 位小数。"],
        ["充值订单", overview.rechargeCount, "类型为 coin_purchase 的金币购买流水数量；人工加币和分享奖励不计入。"],
        ["充值金额（USD）", money(overview.rechargeAmountCents, "USD"), "所有金币购买流水的美元合计。金额按商品 ID 的固定美元售价计算，不使用 Apple 返回的人民币本地化价格。"],
        ["今日 AI 对话", overview.aiConversationsToday, "服务器时区当天创建的 AI 对话请求数量，一次用户消息对应一条对话记录。"],
        ["待审核分享", overview.pendingRewardSubmissions, "当前状态为 pending、等待运营审核的分享奖励提交数量。"]
      ];
      document.getElementById("overviewCards").innerHTML = items.map(([label, value, tooltip]) => metricCard(label, value, tooltip)).join("");

      const monitoring = overview.monitoring;
      const resources = monitoring.resources;
      const today = monitoring.today || {};
      const successRate = today.aiRequests ? ((today.aiSuccesses / today.aiRequests) * 100).toFixed(1) : "100.0";
      const systemItems = [
        ["内存占用", `${resources.memory.percent}%`, `${bytes(resources.memory.rssBytes)} / ${bytes(resources.memory.limitBytes)}`, "当前 Node.js 进程内存占用 ÷ Render 配置的实例内存上限 × 100%。"],
        ["磁盘占用", `${resources.disk.percent}%`, `数据文件 ${bytes(resources.disk.storeBytes)} · 总空间 ${bytes(resources.disk.totalBytes)}`, "持久化磁盘已使用空间 ÷ 磁盘总空间 × 100%。"],
        ["AI 并发", `${resources.aiConcurrency.active}/${resources.aiConcurrency.limit}`, `排队 ${resources.aiConcurrency.queued} · 今日峰值 ${today.peakAIConcurrency || 0}`, "当前正在处理的 AI 请求数 ÷ AI_MAX_CONCURRENCY 并发上限。"],
        ["AI 成功率", `${successRate}%`, `超时 ${today.aiTimeouts || 0} · 不可用 ${today.aiUnavailable || 0}`, "（今日 AI 请求数 − 今日 AI 降级/失败数）÷ 今日 AI 请求数 × 100%；没有请求时显示 100%。"],
        ["平均 AI 延迟", `${today.averageAILatencyMs || 0} ms`, `今日最大 ${today.maxAILatencyMs || 0} ms`, "今日所有已完成 AI 请求从开始到收到结果的平均耗时，单位为毫秒。"],
        ["今日请求量", today.requests || 0, `4xx ${today.http4xx || 0} · 5xx ${today.http5xx || 0}`, "服务器时区当天收到的 HTTP 请求总数，包含 AI、钱包和后台接口。"],
        ["并发失败", today.aiQueueRejected || 0, `运行期间累计 ${resources.aiConcurrency.rejectedSinceRestart}`, "因 AI 并发队列达到上限而被拒绝的请求数量。"],
        ["服务器运行时间", duration(resources.uptimeSeconds), `磁盘写入失败 ${resources.storeWriteFailures}`, "当前后端进程从最近一次启动到现在持续运行的时间。"]
      ];
      document.getElementById("systemCards").innerHTML = systemItems.map(([label, value, note, tooltip]) => `
        <div class="card">
          <span class="metric-help" tabindex="0" aria-label="${escapeHTML(label)} 指标说明" data-tooltip="${escapeHTML(tooltip)}">?</span>
          <div class="label">${escapeHTML(label)}</div>
          <div class="value">${value}</div>
          <div class="metric-note">${escapeHTML(note)}</div>
        </div>
      `).join("");

      document.getElementById("systemAlerts").innerHTML = monitoring.warnings.map((warning) => `
        <div class="alert ${warning.level}"><strong>${escapeHTML(warning.title)}</strong><span>${escapeHTML(warning.message)}</span></div>
      `).join("");

      document.getElementById("dailyUsageTable").innerHTML = table(
        ["日期", "新增用户", "活跃用户", "总请求", "AI 请求", "AI 成功率", "平均延迟", "超时", "不可用", "峰值并发", "队列拒绝"],
        monitoring.dailyUsage.map((item) => {
          const rate = item.aiRequests ? `${((item.aiSuccesses / item.aiRequests) * 100).toFixed(1)}%` : "-";
          return `<tr>
            <td>${item.date}</td>
            <td>${item.newUsers}</td>
            <td>${item.activeUsers}</td>
            <td>${item.requests}</td>
            <td>${item.aiRequests}</td>
            <td>${rate}</td>
            <td>${item.averageAILatencyMs} ms</td>
            <td class="${item.aiTimeouts ? "negative" : ""}">${item.aiTimeouts}</td>
            <td class="${item.aiUnavailable ? "negative" : ""}">${item.aiUnavailable}</td>
            <td>${item.peakAIConcurrency}</td>
            <td class="${item.aiQueueRejected ? "negative" : ""}">${item.aiQueueRejected}</td>
          </tr>`;
        }),
        "暂无每日数据"
      );
    }

    function renderUsers(targetId, users) {
      document.getElementById(targetId).innerHTML = table(
        ["用户", "设备 ID", "金币", "VIP", "AI 对话", "注册时间", "最后活跃"],
        users.map((user) => `
          <tr onclick="loadUserDetail('${user.id}')">
            <td>${user.displayName ? `<strong>${escapeHTML(user.displayName)}</strong><br>` : ""}<code title="${user.id}">${user.id}</code></td>
            <td><code title="${user.deviceId}">${user.deviceId}</code></td>
            <td>${user.coins}</td>
            <td>${user.isPremium ? '<span class="pill vip">VIP</span>' : '<span class="pill">普通</span>'}</td>
            <td><span class="pill active">${user.aiConversationCount || 0}</span></td>
            <td>${time(user.createdAt)}</td>
            <td>${time(user.lastSeenAt)}</td>
          </tr>
        `)
      );
    }

    async function loadUsers(fromSearch = false) {
      const query = encodeURIComponent(document.getElementById("userQuery").value.trim());
      const data = await api(`/v1/admin/users?query=${query}`);
      state.users = data.users;
      renderUsers("usersTable", data.users);
      if (!fromSearch) {
        renderUsers("recentUsers", data.users.slice(0, 8));
      }
    }

    async function loadUserDetail(userId) {
      switchSection("users");
      const data = await api(`/v1/admin/users/${userId}`);
      document.getElementById("userDetailPanel").style.display = "";
      document.getElementById("selectedUserLabel").textContent = userId;
      document.getElementById("userDetail").innerHTML = `
        <div class="detail-grid">
          <div class="profile">
            <h3>基础信息</h3>
            <div class="kv">
              <div>用户 ID：<br><code title="${data.user.id}">${data.user.id}</code></div>
              <div>用户名称：<strong>${escapeHTML(data.user.displayName || "-")}</strong></div>
              <div>设备 ID：<br><code title="${data.user.deviceId}">${data.user.deviceId}</code></div>
              <div>金币数量：<strong>${data.user.coins}</strong></div>
              <div>VIP 状态：<strong>${data.user.isPremium ? "VIP 用户" : "普通用户"}</strong></div>
              <div>注册时间：<strong>${time(data.user.createdAt)}</strong></div>
              <div>最后活跃：<strong>${time(data.user.lastSeenAt)}</strong></div>
            </div>
            <div class="operation-box">
              <label>人工调整金币</label>
              <input id="coinAdjustmentAmount" type="number" min="1" max="1000000" step="1" placeholder="输入金币数量">
              <input id="coinAdjustmentNote" maxlength="240" placeholder="备注，例如：客服补偿、活动奖励">
              <div class="operation-actions">
                <button class="primary" onclick="adjustUserCoins('${data.user.id}', 1)">增加金币</button>
                <button class="danger" onclick="adjustUserCoins('${data.user.id}', -1)">扣除金币</button>
              </div>
              <div class="operation-message" id="coinAdjustmentMessage"></div>
            </div>
          </div>
          <div>
            <div class="panel">
              <div class="panel-head"><h2>该用户充值 / 金币记录</h2></div>
              ${table(["类型", "金币", "金额", "备注", "时间"], data.coinTransactions.map((item) => `
                <tr>
                  <td>${item.type}</td>
                  <td class="${item.coins >= 0 ? "positive" : "negative"}">${item.coins}</td>
                  <td>${money(item.amountCents, item.currency)}</td>
                  <td>${item.note || "-"}</td>
                  <td>${time(item.createdAt)}</td>
                </tr>
              `))}
            </div>
            <div class="panel">
              <div class="panel-head"><h2>该用户 VIP 订阅</h2></div>
              ${table(["套餐", "状态", "金额", "交易 ID", "开始时间"], data.vipSubscriptions.map((item) => `
                <tr>
                  <td>${item.planId}</td>
                  <td><span class="pill active">${item.status}</span></td>
                  <td>${money(item.amountCents, item.currency)}</td>
                  <td><code title="${item.platformTransactionId || "-"}">${item.platformTransactionId || "-"}</code></td>
                  <td>${time(item.startedAt)}</td>
                </tr>
              `))}
            </div>
            <div class="panel">
              <div class="panel-head"><h2>用户与 AI 对话</h2><span class="pill active">${data.aiConversations.length}</span></div>
              ${data.aiConversations.length ? `<div class="conversation-list">${data.aiConversations.map((item) => `
                <div class="conversation">
                  <div class="conversation-meta">${time(item.createdAt)} · ${escapeHTML(item.listenerName)} · ${escapeHTML(item.source)}</div>
                  <div class="conversation-message user"><strong>用户：</strong>${escapeHTML(item.userText)}</div>
                  <div class="conversation-message ai"><strong>AI：</strong>${escapeHTML(item.aiText)}</div>
                </div>
              `).join("")}</div>` : '<div class="empty">暂无 AI 对话</div>'}
            </div>
          </div>
        </div>
      `;
    }

    async function adjustUserCoins(userId, direction) {
      const amountInput = document.getElementById("coinAdjustmentAmount");
      const noteInput = document.getElementById("coinAdjustmentNote");
      const message = document.getElementById("coinAdjustmentMessage");
      const amount = Number(amountInput.value);
      if (!Number.isInteger(amount) || amount <= 0) {
        message.textContent = "请输入大于 0 的整数金币数量。";
        return;
      }
      const coinDelta = amount * direction;
      const action = direction > 0 ? "增加" : "扣除";
      if (!confirm(`确认给该用户${action} ${amount} 金币吗？`)) return;
      message.textContent = "正在提交...";
      try {
        const result = await apiPost(`/v1/admin/users/${userId}`, {
          coinDelta,
          note: noteInput.value.trim() || `后台人工${action}金币`
        });
        message.textContent = `操作成功，当前余额 ${result.user.coins}。`;
        await loadUserDetail(userId);
        await loadUsers();
      } catch (error) {
        message.textContent = error.message;
      }
    }

    async function loadSettings() {
      const data = await api("/v1/admin/settings");
      document.getElementById("initialCoinsInput").value = data.settings.initialCoins;
    }

    document.getElementById("saveInitialCoins").onclick = async () => {
      const input = document.getElementById("initialCoinsInput");
      const message = document.getElementById("initialCoinsMessage");
      const initialCoins = Number(input.value);
      if (!Number.isInteger(initialCoins) || initialCoins < 0 || initialCoins > 1000000) {
        message.textContent = "请输入 0 到 1,000,000 之间的整数。";
        return;
      }
      message.textContent = "正在保存...";
      try {
        const data = await apiPost("/v1/admin/settings", { initialCoins });
        input.value = data.settings.initialCoins;
        message.textContent = `保存成功，新用户将获得 ${data.settings.initialCoins} 金币。`;
      } catch (error) {
        message.textContent = error.message;
      }
    };

    async function loadRecharges() {
      const data = await api("/v1/admin/recharges");
      document.getElementById("rechargesTable").innerHTML = table(
        ["用户 ID", "金币", "金额", "商品", "时间"],
        data.transactions.map((item) => `
          <tr onclick="loadUserDetail('${item.userId}')">
            <td><code title="${item.userId}">${item.userId}</code></td>
            <td class="positive">${item.coins}</td>
            <td>${money(item.amountCents, item.currency)}</td>
            <td>${item.note}</td>
            <td>${time(item.createdAt)}</td>
          </tr>
        `)
      );
    }

    async function loadVip() {
      const data = await api("/v1/admin/vip-subscriptions");
      document.getElementById("vipTable").innerHTML = table(
        ["用户 ID", "套餐", "状态", "金额", "交易 ID", "开始时间"],
        data.subscriptions.map((item) => `
          <tr onclick="loadUserDetail('${item.userId}')">
            <td><code title="${item.userId}">${item.userId}</code></td>
            <td>${item.planId}</td>
            <td><span class="pill active">${item.status}</span></td>
            <td>${money(item.amountCents, item.currency)}</td>
            <td><code title="${item.platformTransactionId || "-"}">${item.platformTransactionId || "-"}</code></td>
            <td>${time(item.startedAt)}</td>
          </tr>
        `)
      );
    }

    async function loadRewards() {
      const data = await api("/v1/admin/reward-submissions");
      document.getElementById("rewardTable").innerHTML = table(
        ["提交 ID", "用户 ID", "平台", "状态", "基础奖励", "证明链接", "时间"],
        data.submissions.map((item) => `
          <tr onclick="loadUserDetail('${item.userId}')">
            <td><code title="${item.id}">${item.id}</code></td>
            <td><code title="${item.userId}">${item.userId}</code></td>
            <td>${item.platform}</td>
            <td>${item.status}</td>
            <td>${item.baseRewardCoins}</td>
            <td>${item.proofLink ? `<a href="${item.proofLink}" target="_blank">打开</a>` : "-"}</td>
            <td>${time(item.createdAt)}</td>
          </tr>
        `)
      );
    }

    async function loadAll() {
      try {
        const overview = await api("/v1/admin/overview");
        renderOverview(overview.overview);
        await Promise.all([loadUsers(), loadRecharges(), loadVip(), loadRewards(), loadSettings()]);
      } catch (error) {
        document.getElementById("overviewCards").innerHTML = `<div class="card"><div class="value">${error.message}</div><div class="label">请检查 ADMIN_TOKEN</div></div>`;
      }
    }

    loadAll();
    setInterval(loadAll, 30000);
  </script>
</body>
</html>
